# Tests for the Japanese grammar analyzer in nihongo/. They use a fake API
# client, so no key or network is needed.

name: nihongo

on:
  push:
    paths: ["nihongo/**", ".github/workflows/nihongo.yml"]
  pull_request:
    paths: ["nihongo/**", ".github/workflows/nihongo.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r nihongo/requirements.txt
      - run: python -m unittest discover -s nihongo/tests -t . -v
